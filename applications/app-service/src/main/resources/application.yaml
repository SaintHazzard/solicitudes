server:
  port: 8091
spring:
  application:
    name: "solicitudes"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  security:
    oauth2:
      client:
        registration:
          autenticacion-client:
            provider: autenticacion-provider
            client-id: gateway-client
            client-secret: gateway-client-secret
            authorization-grant-type: client_credentials
            scope: read,write
        provider:
          autenticacion-provider:
            token-uri: http://localhost:8090/issuer/token
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: solicitudes
    username: postgres
    password: 1324

# Configuración para servicios externos
external:
  service:
    base-url: "http://localhost:8090"
    user-api-url: "http://localhost:8090"
